# Local development only. PostgreSQL for Payload CMS.
# Usage: npm run db:up  (docker compose up -d --wait postgres)
name: drphynex

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: drphynex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drphynex}
      POSTGRES_USER: ${POSTGRES_USER:-drphynex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only; 5433 avoids clashing with other local Postgres instances.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - drphynex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  drphynex_pgdata:
    name: drphynex_pgdata
